services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bntrip
      POSTGRES_USER: bntrip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bntrip_dev_password}
    volumes:
      - bntrip_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bntrip -d bntrip"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [bntrip]

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://bntrip:${POSTGRES_PASSWORD:-bntrip_dev_password}@db:5432/bntrip
      AUTH_SECRET: ${AUTH_SECRET:-replace-this-with-a-long-random-secret}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - bntrip_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [bntrip]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_started
    networks: [bntrip]

volumes:
  bntrip_postgres_data:
  bntrip_uploads:

networks:
  bntrip:
    driver: bridge
